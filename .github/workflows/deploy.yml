name: Deploy to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Backend, Frontend & Nginx images
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          FRONTEND_IMAGE=ghcr.io/$OWNER/icalidad-frontend:latest
          BACKEND_IMAGE=ghcr.io/$OWNER/icalidad-backend:latest
          NGINX_IMAGE=ghcr.io/$OWNER/icalidad-nginx:latest

          # Compilar y subir Backend .NET
          docker build -t $BACKEND_IMAGE -f backend/dockerfile backend
          docker push $BACKEND_IMAGE

          # Compilar y subir Frontend Next.js
          docker build -t $FRONTEND_IMAGE -f frontend/dockerfile frontend
          docker push $FRONTEND_IMAGE

          # Compilar y subir Nginx Reverse Proxy
          docker build -t $NGINX_IMAGE -f nginx/dockerfile nginx
          docker push $NGINX_IMAGE

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/icalidad || true

            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            FRONTEND_IMAGE=ghcr.io/$OWNER/icalidad-frontend:latest
            BACKEND_IMAGE=ghcr.io/$OWNER/icalidad-backend:latest
            NGINX_IMAGE=ghcr.io/$OWNER/icalidad-nginx:latest

            # Crear red privada si no existe
            docker network create icalidad-net || true

            # Detener contenedores anteriores
            docker stop icalidad-nginx icalidad-frontend icalidad-backend icalidad || true
            docker rm icalidad-nginx icalidad-frontend icalidad-backend icalidad || true

            # Descargar nuevas imágenes
            docker pull $BACKEND_IMAGE
            docker pull $FRONTEND_IMAGE
            docker pull $NGINX_IMAGE

            # 1. Iniciar Backend .NET (sin puertos públicos, solo red interna)
            docker run -d \
              --name icalidad-backend \
              --network icalidad-net \
              --restart unless-stopped \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e DB_PROVIDER=SqlServer \
              -e ConnectionStrings__DefaultConnection="Server=${{ secrets.DB_HOST }},${{ secrets.DB_PORT }};Database=${{ secrets.DB_NAME }};User Id=${{ secrets.DB_USER }};Password=${{ secrets.DB_PASS }};TrustServerCertificate=True;Encrypt=True;" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e JWT_ISSUER="iCalidadAPI" \
              -e JWT_AUDIENCE="iCalidadClients" \
              $BACKEND_IMAGE

            # 2. Iniciar Frontend Next.js (sin puertos públicos, solo red interna)
            docker run -d \
              --name icalidad-frontend \
              --network icalidad-net \
              --restart unless-stopped \
              -e BACKEND_API_URL="http://icalidad-backend:5175/api" \
              -e NEXT_PUBLIC_API_URL="/api" \
              -e NEXTAUTH_URL="${{ secrets.NEXTAUTH_URL }}" \
              -e NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e SECRET="${{ secrets.SECRET }}" \
              $FRONTEND_IMAGE

            # 3. Iniciar Nginx Reverse Proxy (escucha en el puerto 8084 del VPS)
            docker run -d \
              --name icalidad-nginx \
              --network icalidad-net \
              --restart unless-stopped \
              -p 8084:80 \
              $NGINX_IMAGE

            docker image prune -f
